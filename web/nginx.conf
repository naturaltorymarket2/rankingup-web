server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript application/wasm;

    # ── 진입 파일은 캐시 금지 ────────────────────────────────────
    # main.dart.js 등 Flutter 진입 파일은 파일명에 해시가 없다.
    # 장기 캐싱하면 새로 배포해도 브라우저가 옛 버전을 계속 쓴다.
    location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ── 해시가 붙은 정적 리소스만 장기 캐싱 ──────────────────────
    location ~* ^/(assets|canvaskit|icons)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 그 외 정적 파일 — 짧게 캐시하되 항상 서버에 변경 여부를 확인
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — /admin/charge 등 모든 경로를 index.html로 처리
    location / {
        try_files $uri $uri/ /index.html;
    }
}
